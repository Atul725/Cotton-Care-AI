services:
  # 1. FastAPI Backend with APScheduler and SQLite
  - type: web
    name: cottoncare-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    disk:
      name: cottoncare-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/cottoncare.db
      - key: GEMINI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true

  # 2. React Vite Frontend
  - type: static
    name: cottoncare-web
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cottoncare-api
          envVarKey: RENDER_EXTERNAL_URL
